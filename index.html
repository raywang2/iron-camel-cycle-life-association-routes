<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>2026 鐵駱駝環島路線｜道路網 GPX</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon.svg">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <p id="brandEyebrow" class="eyebrow">2026 鐵駱駝</p>
          <h1 id="appTitle">環島路線地圖</h1>
          <p id="summary" class="sub">載入路線資料中...</p>
        </div>

        <div id="routeStats" class="stats" aria-label="路線統計"></div>

        <div class="language-row">
          <span id="languageLabel" class="control-label">語言</span>
          <div id="languageSwitch" class="segmented" role="group" aria-label="語言切換">
            <button type="button" data-lang="zh" aria-pressed="true">中</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="ja" aria-pressed="false">日</button>
          </div>
        </div>

        <label id="daySelectLabel" class="control-label" for="daySelect">每日路線</label>
        <select id="daySelect" aria-label="選擇每日路線"></select>

        <div class="grid2">
          <button id="prevBtn" type="button">上一天</button>
          <button id="nextBtn" type="button">下一天</button>
        </div>
        <button id="allBtn" class="primary" type="button">顯示全路線</button>
        <button id="poiToggleBtn" type="button" aria-pressed="true">隱藏休息點</button>
        <button id="locationBtn" type="button">顯示現在位置</button>
        <a id="gpxLink" class="dl" href="#" download hidden>下載本日 GPX</a>

        <div class="legend" aria-label="地圖圖例">
          <span><i class="dot blue"></i><span id="legendRide">單日路線</span></span>
          <span><i class="dot gray"></i><span id="legendNonRide">非騎乘日</span></span>
          <span><i class="dot teal"></i><span id="legendStart">起點</span></span>
          <span><i class="dot red"></i><span id="legendFinish">終點</span></span>
          <span><i class="dot green"></i><span id="legendRest">10km 休息點</span></span>
        </div>

        <section id="info" class="card" aria-live="polite"></section>
      </aside>

      <section class="map-stage" aria-label="路線地圖">
        <div id="map"></div>
      </section>
    </main>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
